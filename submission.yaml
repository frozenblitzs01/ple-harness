# Local-dev variant of google-research/ple sample_submissions/minimal.
# model_api switched to openai-compatible so kit check can run locally
# against a local OpenAI-compatible model server.
# For the real submission this MUST go back to a google-cloud/<id> model.
name: frozen008-harness
model_api: gemini/gemini-3.5-flash-lite
install: >-
  uv venv --python 3.12 /opt/harness/venv
  && uv pip install --python /opt/harness/venv/bin/python -r {src}/requirements.txt
serve: /opt/harness/venv/bin/python {src}/serve.py
